<!DOCTYPE html>
<html>
    <head>
        <title>Pi Web Kiosk Admin Panel</title>
        <link rel="stylesheet" href="/assets/pico.min.css">
        <script src="/assets/alpine.min.js" defer></script>
    </head>
    <body>
        <main class="container" x-data="{ url: '', refreshSeconds: 0, status: '' }"
            x-init="fetch('/config').then(r => r.json()).then(d => { url = d.url; refreshSeconds = d.refreshSeconds })">
            <article>
                <h2>Signage Admin</h2>
                <form @submit.prevent="
                fetch('/config', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ url, refreshSeconds })
                }).then(r => status = r.ok ? 'Saved' : 'Failed')">
                    <label>URL <input x-model="url" type="url" required></label>
                    <label>Refresh (seconds) <input x-model="refreshSeconds" type="number"></label>
                    <button type="submit">Save</button>
                </form>
                <p x-show="status" x-text="status"></p>
            </article>
        </main>
    </body>
</html>
